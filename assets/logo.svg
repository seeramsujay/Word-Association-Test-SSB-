<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A100D" />
      <stop offset="50%" stop-color="#141E18" />
      <stop offset="100%" stop-color="#060B08" />
    </linearGradient>

    <!-- Military Olive to Gold Gradient -->
    <linearGradient id="military-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Psychometric Focus Ring -->
    <linearGradient id="focus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#23352A" stroke-width="2" />

  <!-- 15-Second Psychometric Timer Dial Reticle -->
  <g opacity="0.18" stroke="#10B981" stroke-width="1.5">
    <circle cx="400" cy="380" r="140" fill="none" stroke-dasharray="6 6" />
    <circle cx="400" cy="380" r="230" fill="none" stroke-dasharray="8 8" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-dasharray="4 8" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- Outer Stopwatch / Stopwatch Crown -->
  <circle cx="400" cy="380" r="170" fill="url(#core-glow)" stroke="url(#military-grad)" stroke-width="8" filter="url(#glow)" />
  <!-- Stopwatch Top Button / Crown -->
  <rect x="375" y="160" width="50" height="30" rx="6" fill="#F59E0B" stroke="#F8FAFC" stroke-width="2" />
  <line x1="400" y1="190" x2="400" y2="210" stroke="#F59E0B" stroke-width="8" />

  <!-- 60-Second Sub-Division Tick Marks on Dial -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="400" y1="225" x2="400" y2="245" stroke-width="5" />
    <line x1="555" y1="380" x2="535" y2="380" stroke-width="5" />
    <line x1="400" y1="535" x2="400" y2="515" stroke-width="5" />
    <line x1="245" y1="380" x2="265" y2="380" stroke-width="5" />
  </g>

  <!-- Central Word Association Lightning & Armed Forces Star -->
  <g filter="url(#subtle-glow)">
    <!-- Tri-Service 5-Point Star -->
    <polygon points="400,280 418,340 480,340 430,375 450,435 400,400 350,435 370,375 320,340 382,340" fill="#14261C" stroke="url(#military-grad)" stroke-width="4" />

    <!-- Spontaneous Thought Flash / Lightning Bolt across Star -->
    <polygon points="410,290 375,370 415,370 385,450 435,360 395,360" fill="#F59E0B" stroke="#F8FAFC" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Quick Typography "W A T" Word Association Prompt -->
  <text x="400" y="500" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-weight="700" fill="#22D3EE" letter-spacing="8" filter="url(#subtle-glow)">
    RESILIENCE
  </text>

  <!-- Timer 15s Countdown Arc -->
  <path d="M 400 210 A 170 170 0 0 1 570 380" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round" filter="url(#subtle-glow)" />

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    SSB<tspan fill="#F59E0B">WAT</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    PSYCHOMETRIC SIMULATOR &amp; TRAINER
  </text>
</svg>
